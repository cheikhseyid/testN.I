<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.home">Mawjoud — Points d'eau</title>
  <script>
    // Starts GET /points while CSS/JS download (saves one round trip on slow networks).
    // Inline on purpose: an external script would run too late. Same rule as js/config.js —
    // keep both in sync (a mismatch only wastes the preload, it doesn't break the page).
    (function () {
      var h = location.hostname;
      var local = location.protocol === "file:" || !h || h === "localhost" || h === "127.0.0.1" ||
        h === "[::1]" || /\.localhost$/.test(h) || /^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(h);
      var link = document.createElement("link");
      link.rel = "preload";
      link.as = "fetch";
      link.crossOrigin = "anonymous";
      link.href = (local ? "http://" + (h || "localhost") + ":8000" : "https://mawjoud-api.onrender.com") + "/points";
      document.head.appendChild(link);
    })();
  </script>
  <!-- Emoji favicon inlined: saves the /favicon.ico request (a 404 otherwise). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💧%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <!-- Deferred: downloaded in parallel, run in order after parsing, never block rendering. -->
  <script src="js/config.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/carte.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Mawjoud</a>
    <button class="lang-toggle" type="button" data-lang-toggle>عربي</button>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="nav-burger" data-i18n-aria="nav.menu" aria-label="Menu"><span></span></label>
    <nav class="site-nav">
      <a href="index.html" aria-current="page" data-i18n="nav.home">Accueil</a>
      <a href="signaler.html" data-i18n="nav.report">Signaler</a>
      <a href="dashboard.html" data-i18n="nav.dashboard">Tableau de bord</a>
      <a href="conseils.html" data-i18n="nav.tips">Conseils</a>
    </nav>
  </header>
  <main class="container">
    <div id="alert-banner" class="alert-banner" role="alert" hidden></div>
    <h1 data-i18n="home.title">Trouver un point d'eau</h1>
    <p class="lead" data-i18n="home.lead">Puits, bornes-fontaines et citernes près de chez vous, avec leur état en temps réel.</p>
    <label class="field">
      <span data-i18n="home.search_label">Quartier</span>
      <input type="search" id="search" data-i18n-placeholder="home.search_ph" placeholder="Rechercher un quartier…">
    </label>
    <div class="list-head">
      <h2 data-i18n="home.list_title">Points d'eau</h2>
      <button type="button" id="map-toggle" class="btn btn-outline" aria-expanded="false" aria-controls="map">Voir la carte</button>
    </div>
    <p id="list-status" class="list-status" role="status" aria-live="polite"></p>
    <div id="map" class="map" dir="ltr" hidden></div>
    <ul id="points" class="card-list">
      <li class="card muted" data-i18n="common.loading">Chargement…</li>
    </ul>
    <a class="btn btn-primary btn-block" href="signaler.html" data-i18n="home.cta_report">Signaler un problème</a>
  </main>
  <footer class="site-footer"><small data-i18n="footer.text">Mawjoud — l'eau près de chez vous</small></footer>
</body>
</html>
